name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - semver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .esphome
            ~/.esphome
            ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('src/*') }}-${{ hashFiles('childrensclock.yaml') }}
      - run: pip install -r requirements.txt
      - run: bundle exec rake test
      - run: bundle exec rake build
        env:
          VERSION: ${{ needs.semver.outputs.semantic_version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-factory.bin
          path: .esphome/build/childrensclock/build/firmware.factory.bin

  semver:
    name: Generate a semantic version number
    runs-on: ubuntu-latest
    outputs:
      semantic_version: ${{ steps.semver.outputs.semantic_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - id: semver
        uses: lukaszraczylo/semver-generator@9d5b4b0b503562fecc7c60ace69ddfe10f9957a2 # v1.17.14
        with:
          config_file: .github/semver.yaml
          repository_local: true

  release-binaries:
    name: Release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs:
      - build
      - semver

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware-factory.bin
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.semver.outputs.semantic_version }}
          name: v${{ needs.semver.outputs.semantic_version }}
          prerelease: false
          files: "firmware-factory.bin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
