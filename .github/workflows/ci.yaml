name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - semver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .esphome
            ~/.esphome
            ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('src/*') }}-${{ hashFiles('childrensclock.yaml') }}
      - run: pip install -r requirements.txt
      - run: bundle exec rake test
      - run: bundle exec rake build
        env:
          VERSION: ${{ needs.semver.outputs.semantic_version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-factory.bin
          path: .esphome/build/childrensclock/build/firmware.factory.bin

  semver:
    name: Generate a semantic version number
    runs-on: ubuntu-latest
    outputs:
      semantic_version: ${{ steps.semver.outputs.semantic_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - id: semver
        uses: lukaszraczylo/semver-generator@c266ed8967ee80afe22eb38937e4eb2a6608fd32 # v1.18.29
        with:
          config_file: .github/semver.yaml
          repository_local: true

  release-binaries:
    name: Release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs:
      - build
      - semver

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-factory.bin
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.semver.outputs.semantic_version }}
          name: v${{ needs.semver.outputs.semantic_version }}
          prerelease: false
          files: "firmware-factory.bin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
